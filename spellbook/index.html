        <div class="g-hud"><span>FOUND <b id="gFound">0</b> / 10</span><span>⏱ <b id="gTime">0</b>s</span><span><button class="t-btn white" type="button" id="gHint">💡 Hint</button> <button class="t-btn dark" type="button" id="gReset">↺ Restart</button></span></div>
        ${scene}
        <div class="g-toast" id="gToast"><span class="doc" aria-hidden="true"></span><div><b id="gT">Start tapping around 👆</b><span id="gP">Houses, shops, cars, even the elevator. Contracts hide everywhere.</span></div></div>
        <div class="g-done" id="gDone"><h3>All 10 found in <span id="gSecs">0</span> seconds. ✍️</h3><p>Every one of these runs on a contract, and Spellbook drafts, reviews and redlines them right inside Word. That's why "contracts at the speed of commerce" matters.</p><button class="t-btn dark" type="button" id="gAgain">Play again</button></div>
      </div>
      <p class="g-credit rv">The first seven come straight from Meltem's post. I added the last three.</p>`;
    const hero = document.getElementById('top');
    hero.after(game);
    const nav = document.querySelector('.t-nav ul');
    if (nav) nav.insertAdjacentHTML('afterbegin', '<li><a href="#game" data-nav="game">The game</a></li>');
    // reveal the new bits too
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12 });
    game.querySelectorAll('.rv').forEach(el => io.observe(el));

    let found = new Set(), t0 = 0, timer = null;
    const $ = id => document.getElementById(id);
    const start = () => { if (!timer) { t0 = Date.now(); timer = setInterval(() => $('gTime').textContent = Math.floor((Date.now() - t0) / 1000), 250); } };
    function hit(g) {
      start();
      const k = g.dataset.k, f = FIND.find(x => x[0] === k);
      $('gT').textContent = f[1]; $('gP').textContent = f[2];
      if (found.has(k)) return;
      found.add(k); g.classList.add('found'); g.classList.remove('hint'); $('gFound').textContent = found.size;
      if (found.size === FIND.length) { clearInterval(timer); timer = null; $('gSecs').textContent = Math.floor((Date.now() - t0) / 1000); $('gDone').classList.add('on'); }
    }
    document.querySelectorAll('#street .hs').forEach(g => { g.addEventListener('click', () => hit(g)); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hit(g); } }); });
    $('gHint').addEventListener('click', () => { const left = [...document.querySelectorAll('#street .hs:not(.found)')]; if (!left.length) return; const g = left[Math.floor(Math.random() * left.length)]; g.classList.add('hint'); setTimeout(() => g.classList.remove('hint'), 2200); });
    const reset = () => { found.clear(); clearInterval(timer); timer = null; $('gFound').textContent = 0; $('gTime').textContent = 0; document.querySelectorAll('#street .hs').forEach(g => g.classList.remove('found', 'hint')); $('gDone').classList.remove('on'); $('gT').textContent = 'Start tapping around 👆'; $('gP').textContent = 'Houses, shops, cars, even the elevator. Contracts hide everywhere.'; };
    $('gReset').addEventListener('click', reset); $('gAgain').addEventListener('click', reset);

    /* ---------- the intro film: a Word doc that drafts itself ---------- */
    const heroCta = document.querySelector('.t-hero .cta');
    if (heroCta) heroCta.insertAdjacentHTML('beforeend', '<button class="t-btn white replay-film" type="button" id="replayFilm">▶ Replay the film</button>');
    function film(auto) {
      const el = document.createElement('div'); el.className = 'sb-film'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Intro film');
      el.innerHTML = `<button class="skip" type="button">Skip →</button>
        <div class="word">
          <div class="w-title"><i></i><i></i><i></i><b>Social_Media_Lead_Agreement_DRAFT.docx</b><span>Saved · Durva Thakkar</span></div>
          <div class="w-ribbon"><span>File</span><span>Home</span><span>Insert</span><span>Layout</span><span>Review</span><span class="sb">✨ Spellbook</span></div>
          <div class="w-body">
            <div class="w-canvas"><div class="w-page" id="wPage"><h4>Draft agreement · not legal advice 😄</h4></div><div class="w-stamp" id="wStamp">READY FOR REVIEW</div><button class="t-btn dark w-go" type="button" id="wGo">Open the full draft →</button></div>
            <div class="w-panel"><div class="hd"><i></i>Spellbook</div><div id="wSug"></div></div>
          </div>
        </div>`;
      document.body.appendChild(el); document.body.classList.add('t-lock');
      const page = el.querySelector('#wPage'), sug = el.querySelector('#wSug');
      let alive = true;
      const close = () => { if (!alive) return; alive = false; el.classList.add('bye'); document.body.classList.remove('t-lock'); setTimeout(() => el.remove(), 650); };
      el.querySelector('.skip').addEventListener('click', close); el.querySelector('#wGo').addEventListener('click', close);
      addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); removeEventListener('keydown', esc); } });
      const wait = ms => new Promise(r => setTimeout(r, still ? 0 : ms));
      const line = (cls = '') => { const d = document.createElement('div'); d.className = 'ln ' + cls; page.appendChild(d); return d; };
      async function type(node, text, speed = 28) { node.classList.add('caret'); if (still) { node.innerHTML += text; node.classList.remove('caret'); return; } for (const ch of text) { if (!alive) return; node.insertAdjacentText('beforeend', ch); await wait(speed); } node.classList.remove('caret'); }
      const suggest = (label, text, ok) => { const d = document.createElement('div'); d.className = 'w-sug' + (ok ? ' ok' : ''); d.innerHTML = `<b>${label}</b>${text}`; sug.appendChild(d); requestAnimationFrame(() => d.classList.add('on')); while (sug.children.length > 4) sug.firstElementChild.remove(); };
      (async () => {
        await wait(500);
        const hi = line('big'); await type(hi, 'Dear Hiring Manager,', 45);
        await wait(300); suggest('Suggested edit', 'Too generic. Make it personal.');
        await wait(900); hi.innerHTML = '<del>Dear Hiring Manager,</del> <ins>Hey Meltem 👋</ins>'; suggest('Accepted', 'Replaced greeting.', true);
        await wait(700); await type(line(), "This isn't a cover letter. It's a draft agreement, reviewed in Word, obviously.");
        await wait(300); const c1 = line('cl'); c1.innerHTML = '<b>1. Parties.</b> '; await type(c1, 'Spellbook (represented by Meltem Kuran Berkowitz, CMO) and Durva Thakkar, applicant for Social Media Lead.', 14);
        const c2 = line('cl'); c2.innerHTML = '<b>2. Scope.</b> '; await type(c2, "Build Spellbook's social presence from the ground up: voice, calendar and strategy.", 14);
        suggest('Risk: vague', 'Claims without proof. Suggest adding deliverables.');
        await wait(800); const c3 = line('cl'); c3.innerHTML = `<b>3. Proof.</b> <ins>Attached: a 90-day plan, a voice guide, ${tasks} pieces of real work, a game, and ${ideas} executive post ideas.</ins>`; suggest('Accepted', 'Proof attached.', true);
        await wait(900); const c4 = line('cl'); c4.innerHTML = '<b>4. No AI slop.</b> '; await type(c4, 'Every line is checked by a human (me).', 16);
        await wait(500);
        const sig = document.createElement('div'); sig.className = 'w-sig'; sig.innerHTML = `<div><img src="/assets/durva-avatar.jpg" alt=""><span class="sl"><span class="line" id="s1">Durva Thakkar</span></span><small>Durva Thakkar · applicant</small></div><div><img src="/spellbook/meltem.jpg" alt=""><span class="sl"><span class="line" id="s2">&nbsp;</span></span><small>Meltem Kuran Berkowitz · your turn ✍️</small></div>`;
        page.appendChild(sig); await wait(60); sig.classList.add('on'); await wait(400); sig.querySelector('#s1').classList.add('signed');
        await wait(1500); el.querySelector('#wStamp').classList.add('on'); suggest('All clear', 'No issues found. Ready to sign.', true);
        await wait(700); el.querySelector('#wGo').classList.add('on');
        if (auto) await wait(9000), close();
      })();
    }
    document.getElementById('replayFilm')?.addEventListener('click', () => film(false));
    let seen = false; try { seen = !!sessionStorage.getItem('sb_film'); sessionStorage.setItem('sb_film', '1'); } catch (e) {}
    if (!seen && !still && !/[?&]nofilm/.test(location.search)) film(true);
  })();
  </script>
</body>
</html>
